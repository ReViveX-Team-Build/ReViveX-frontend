<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Main Brain Coral Gradient -->
    <radialGradient id="brainMain" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF9BEF"></stop>
      <stop offset="60%" stop-color="#FF4FCF"></stop>
      <stop offset="100%" stop-color="#C218A8"></stop>
    </radialGradient>

    <!-- Secondary Coral Gradient -->
    <radialGradient id="brainSecondary" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFA8F5"></stop>
      <stop offset="100%" stop-color="#E044C4"></stop>
    </radialGradient>

    <!-- Soft Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="40" flood-color="#6B0F5F" flood-opacity="0.5"></feDropShadow>
    </filter>
  </defs>

  <!-- MAIN LARGE BRAIN CORAL -->
  <g filter="url(#softShadow)">
    <ellipse cx="1900" cy="1400" rx="700" ry="520" fill="url(#brainMain)"></ellipse>
    
    <!-- Brain grooves -->
    <path d="M1400 1300 Q1700 1100 2100 1250 T2500 1300" stroke="#8A0F74" stroke-width="40" fill="none" stroke-linecap="round"></path>
    <path d="M1450 1450 Q1800 1250 2250 1450" stroke="#8A0F74" stroke-width="38" fill="none" stroke-linecap="round"></path>
    <path d="M1500 1550 Q1850 1500 2300 1600" stroke="#8A0F74" stroke-width="35" fill="none" stroke-linecap="round"></path>
    <path d="M1550 1200 Q1800 1000 2200 1150" stroke="#8A0F74" stroke-width="32" fill="none" stroke-linecap="round"></path>
  </g>

  <!-- ATTACHED SMALLER CLUSTER BRAINS -->
  <g filter="url(#softShadow)">
    <ellipse cx="1250" cy="1500" rx="320" ry="260" fill="url(#brainSecondary)"></ellipse>
    <path d="M1050 1500 Q1200 1400 1400 1500" stroke="#9A1A85" stroke-width="20" fill="none" stroke-linecap="round"></path>
    <path d="M1100 1600 Q1300 1550 1450 1650" stroke="#9A1A85" stroke-width="18" fill="none" stroke-linecap="round"></path>
  </g>

  <g filter="url(#softShadow)">
    <ellipse cx="2500" cy="1550" rx="280" ry="230" fill="url(#brainSecondary)"></ellipse>
    <path d="M2350 1500 Q2500 1400 2650 1500" stroke="#9A1A85" stroke-width="18" fill="none" stroke-linecap="round"></path>
    <path d="M2400 1600 Q2550 1580 2700 1680" stroke="#9A1A85" stroke-width="16" fill="none" stroke-linecap="round"></path>
  </g>

  <!-- BASE ATTACHMENT TO SAND -->
  <ellipse cx="1900" cy="1750" rx="800" ry="120" fill="#A85F2D" opacity="0.7"></ellipse>

</svg>